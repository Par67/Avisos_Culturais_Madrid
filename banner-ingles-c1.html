<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English C1 banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, sporty, modern atlas — a light pastel classroom banner
   IDEA: an airmail postcard travelling round the English-speaking world, postmarked in every country
   PICTURE: deep-teal sea, pale land, dashed flight trail, each country lights up and gets a red postmark
   COLOUR and TYPE: deep teal, paper white, tomato red, saffron, sky blue; Bricolage Grotesque, Instrument Sans, DM Mono
   LAYOUT: full-width map band, title card over the South Pacific, round controls bottom-right */
:root{color-scheme:light;--ocean:#0f4a50;--land:#f4f1ea;--edge:#7fa7a8;--ink:#12343a;--red:#e4572e;--blue:#0f4a50;--saff:#f3a712}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:transparent}
body{font:16px/1.5 "Instrument Sans",system-ui,sans-serif;color:var(--ink);overflow-x:clip}
#banner{position:relative;width:100%;aspect-ratio:1500/470;min-height:180px;overflow:hidden;border-radius:18px;
  background:radial-gradient(120% 140% at 55% 40%,#17656b 0%,var(--ocean) 55%,#0a353a 100%)}
#banner.pseudo-fs{position:fixed;inset:0;z-index:9999;border-radius:0;aspect-ratio:auto;height:100vh}
html.embed #banner{aspect-ratio:auto;height:100vh;min-height:0;border-radius:0}
#banner:fullscreen{border-radius:0;aspect-ratio:auto;height:100vh}
#map{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.country{fill:var(--land);stroke:var(--edge);stroke-width:.45;stroke-linejoin:round;transition:fill .7s ease}
.grat{stroke:rgba(255,255,255,.13);stroke-width:.5;stroke-dasharray:2 4;fill:none}
.stop-dot{fill:#fff;stroke-width:2}
.trail{fill:#fff;opacity:.7}
.ripple{fill:none;stroke-width:1.4}
.pop{position:absolute;z-index:6;width:clamp(150px,19vw,260px);background:#fffdf8;border-radius:14px;padding:clamp(8px,1vw,14px) clamp(10px,1.2vw,16px) clamp(10px,1.1vw,16px);
  text-align:center;box-shadow:0 22px 50px -18px rgba(0,0,0,.75);border-top:5px solid transparent;
  background-image:linear-gradient(#fffdf8,#fffdf8),repeating-linear-gradient(135deg,#e4572e 0 9px,#fffdf8 9px 15px,#0f4a50 15px 24px,#fffdf8 24px 30px);
  background-origin:border-box;background-clip:padding-box,border-box;
  transform:scale(.2);opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.pop.on{transform:scale(1);opacity:1}
.pop.fly{transition:transform .9s ease-in,opacity .9s ease-in}
.pop img{display:block;margin:0 auto;height:clamp(56px,9.5vw,150px);max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.pop b{display:block;margin-top:6px;font:800 clamp(14px,1.5vw,21px)/1.1 "Bricolage Grotesque",sans-serif;color:var(--ink)}
.pop small{display:block;margin-top:6px;font:500 clamp(9px,.8vw,12px)/1.2 "DM Mono",monospace;color:#7b8c8e}
.pop span{display:block;margin-top:3px;font:600 clamp(12px,1.15vw,16px)/1.3 "Instrument Sans",sans-serif;color:#5f7173}
.pop span i{color:var(--red);font-weight:700}
.lead{stroke:rgba(255,255,255,.55);stroke-width:.7;stroke-dasharray:1.5 2;fill:none}
.lbl rect{fill:#fff;stroke:none}
.lbl text{font:600 8.5px "Instrument Sans",sans-serif;fill:var(--ink)}
.lbl .gl{font-weight:500;fill:#5f7173}
.lbl .w{font-style:italic;font-weight:600;fill:#e4572e}
.lbl{transition:opacity .5s ease}
.card{position:absolute;right:2.2%;top:6%;max-width:25%;padding:clamp(3px,.35vw,5px);border-radius:6px;
  background:repeating-linear-gradient(135deg,#e4572e 0 9px,#fffdf8 9px 15px,#0f4a50 15px 24px,#fffdf8 24px 30px);box-shadow:0 14px 34px -14px rgba(0,0,0,.6)}
.card .in{background:#fffdf8;border-radius:3px;padding:clamp(6px,.9vw,13px) clamp(10px,1.4vw,20px)}
.dept{font:500 clamp(8px,.8vw,12px)/1.3 "DM Mono",monospace;color:#4f6f72;letter-spacing:.02em;margin:0 0 4px}
h1{font:800 clamp(18px,2.9vw,44px)/1 "Bricolage Grotesque",sans-serif;margin:0;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
h1 span{color:var(--red)}
.teacher{display:flex;align-items:center;gap:8px;margin:clamp(4px,.8vw,10px) 0 0;font:600 clamp(10px,1vw,15px)/1.2 "Instrument Sans",sans-serif;color:#2c4b50}
.teacher i{width:clamp(8px,.8vw,11px);aspect-ratio:1;border-radius:50%;background:var(--saff)}
.ctrls{position:absolute;left:2%;bottom:6%;display:flex;gap:8px;z-index:5}
.ctrls button{width:44px;height:44px;border-radius:50%;border:0;background:#fffdf8;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px -6px rgba(30,50,90,.4);transition:transform .15s}
.ctrls button:hover{transform:translateY(-2px)}
.ctrls button:focus-visible{outline:3px solid var(--saff);outline-offset:2px}
.ctrls svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){.card{max-width:62%;left:3%;bottom:6%;border-radius:12px}.ctrls{gap:6px}.ctrls button{width:38px;height:38px}}
</style>
</head>

const W=window.__WORLD;

const R=6381372,RD=Math.PI/180;
function proj(lat,lon){
  let dl=lon-11.5;if(dl<-180)dl+=360;if(dl>180)dl-=360;

/* sound: a very soft chime made with the Web Audio API */
let ac=null,soundOn=false;
function pock(v){
  if(!soundOn||!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain(),lp=ac.createBiquadFilter();

const ig=$('icons');
function showIcon(p,instant){
  if(Math.hypot(p.ix-p.x,p.iy-p.y)>6)el('line',{x1:p.x,y1:p.y,x2:p.ix,y2:p.iy,class:'lead'},ig);
  const g=el('g',{},ig);
  const ic=ICONS[p.c],ih=ic.h,iw=ih*ic.ar;
  el('ellipse',{cx:0,cy:0,rx:Math.max(6,iw*.42),ry:2.2,fill:'rgba(0,0,0,.28)'},g);
  el('image',{href:ic.src,x:-iw/2,y:-ih,width:iw,height:ih},g);
  if(instant){g.setAttribute('transform',`translate(${p.ix},${p.iy})`);return}
  const t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/520);const sc=k<1?1-Math.cos(k*Math.PI*1.25)*Math.exp(-4*k)*1:1;
    g.setAttribute('transform',`translate(${p.ix},${p.iy}) scale(${Math.max(.01,1.08*(1-Math.exp(-6*k))-(k>.6?.08*(k-.6)/.4:0))})`);
    if(k<1&&alive===run)requestAnimationFrame(f)})(t0);
}

/* labels */
const lg=$('labels');
function label(p){
  const grp=el('g',{class:'lbl',opacity:0},lg);
  const r=el('rect',{rx:7,ry:7},grp),t=el('text',{},grp);
  const a=el('tspan',{},t);a.textContent=p.n+'  ·  ';const b=el('tspan',{class:'w'},t);b.textContent=p.w;const gl=el('tspan',{class:'gl'},t);gl.textContent='  = '+p.g;
  const bb=t.getBBox(),w=bb.width+12,h=14;
  const ihh=ICONS[p.c].h;let x=p.ix-w/2,y=p.iy-h-ihh-5;
  if(p.d==='down')y=p.iy+6;
  if(p.d==='left'){x=p.ix-w-ICONS[p.c].h*ICONS[p.c].ar/2-5;y=p.iy-ihh/2-h/2}
  x=Math.max(4,Math.min(896-w,x));
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
  t.setAttribute('x',x+6);t.setAttribute('y',y+10);
  requestAnimationFrame(()=>grp.setAttribute('opacity',1));
  setTimeout(()=>grp.setAttribute('opacity',0),2600);
  setTimeout(()=>grp.remove(),3200);
}
function ripple(p){
  const c=el('circle',{cx:p.x,cy:p.y,r:3,class:'ripple',stroke:'#fff'},$('trail'));
  const t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/700);c.setAttribute('r',3+k*16);c.setAttribute('opacity',1-k);if(k<1&&alive===run)requestAnimationFrame(f);else c.remove()})(t0);
}
function postmark(p){
  const ox=p.d==='left'?-24:9;
  const g=el('g',{class:'pm',transform:`translate(${p.x+ox},${p.y-7}) rotate(-14) scale(1.8)`,opacity:.95},$('trail'));
  el('circle',{r:4.2},g);el('circle',{r:2.6},g);
  el('path',{d:'M5 -1.6q1.5 -1 3 0t3 0t3 0M5 0q1.5 -1 3 0t3 0t3 0M5 1.6q1.5 -1 3 0t3 0t3 0'},g);
  const t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/260);g.setAttribute('transform',`translate(${p.x+ox},${p.y-7}) rotate(-14) scale(${1.8-k})`);if(k<1&&alive===run)requestAnimationFrame(f)})(t0);
}
const svg=$('map'),HOLD=4600;
function scr(x,y){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const q=pt.matrixTransform(svg.getScreenCTM()),r=bn.getBoundingClientRect();return{x:q.x-r.left,y:q.y-r.top}}
function popup(p){
  const my=run,d=document.createElement('div');d.className='pop';
  const im=document.createElement('img');im.src=ICONS[p.c].src;im.alt='';
  const b=document.createElement('b');b.textContent=p.n;
  const sp=document.createElement('span');const it=document.createElement('i');it.textContent=p.w;sp.append(it,' = '+p.g);
  const lw=document.createElement('small');lw.textContent='Local English word';
  d.append(im,b,lw,sp);bn.appendChild(d);
  const r=bn.getBoundingClientRect(),pw=d.offsetWidth,ph=d.offsetHeight,s=scr(p.x,p.y);
  const L=Math.max(8,Math.min(r.width-pw-8,s.x-pw/2)),T=Math.max(8,Math.min(r.height-ph-8,s.y-ph-24));
  d.style.left=L+'px';d.style.top=T+'px';d.style.transformOrigin=`${s.x-L}px ${s.y-T}px`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  setTimeout(()=>{if(my!==run){d.remove();return}
    const t=scr(p.ix,p.iy-ICONS[p.c].h/2);
    d.style.transformOrigin='50% 50%';d.classList.add('fly');
    d.style.transform=`translate(${t.x-(L+pw/2)}px,${t.y-(T+ph/2)}px) scale(.12)`;d.style.opacity='0';
    setTimeout(()=>{d.remove();if(my===run)showIcon(p)},880);
  },HOLD-950);
}
function land(p,v){
  if(cmap[p.c])cmap[p.c].style.fill=COL[p.k];
  p.dot.setAttribute('opacity',1);ripple(p);popup(p);pock(NOTES[pts.indexOf(p)%NOTES.length]);
}

/* animation */
const ball=$('ball'),inner=$('ballInner'),shadow=$('shadow'),tg=$('trail');
let run=0,alive=0;
function setBall(x,y,h,sx,sy,rot){
  ball.setAttribute('transform',`translate(${x},${y-h})`);
  inner.setAttribute('transform',`rotate(${rot}) scale(${sx},${sy})`);
  shadow.setAttribute('cx',x);shadow.setAttribute('cy',y+1);
  const s=Math.max(.35,1-h/150);shadow.setAttribute('rx',6*s);shadow.setAttribute('ry',2*s);shadow.setAttribute('opacity',0);
}
function reset(){
  tg.innerHTML='';lg.innerHTML='';ig.innerHTML='';bn.querySelectorAll('.pop').forEach(e=>e.remove());
  for(const k in cmap)cmap[k].style.fill='';
  pts.forEach(p=>p.dot.setAttribute('opacity',.45));
}
function buildLegs(){
  const legs=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dist=Math.hypot(b.x-a.x,b.y-a.y);
    legs.push({a,b,H:Math.min(70,10+dist*.2),dur:1100+dist*5,land:b});
  }
  return legs;
}
function play(){
  run++;alive=run;const my=run;
  reset();
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){pts.forEach(p=>{if(cmap[p.c])cmap[p.c].style.fill=COL[p.k];p.dot.setAttribute('opacity',1);showIcon(p,true)});ball.setAttribute('opacity',1);const z=pts[pts.length-1];setBall(z.x,z.y,0,1,1,0);return}
  const legs=buildLegs();let li=0,t0=null,rot=0,last=null,squash=0;
  ball.setAttribute('opacity',1);
  const first=pts[0];setBall(first.x,first.y,0,1,1,0);
  setTimeout(()=>{if(my!==run)return;land(first);t0=performance.now()+HOLD;requestAnimationFrame(step)},700);
  function step(now){
    if(my!==run)return;
    if(t0===null)t0=now;
    if(now<t0){requestAnimationFrame(step);return}
    const L=legs[li];let t=(now-t0)/L.dur;
    if(t>=1){
      land(L.land);
      squash=now;li++;t0=now+HOLD;
      if(li>=legs.length){const z=pts[pts.length-1];setBall(z.x,z.y,0,1,1,0);setTimeout(()=>{if(my===run)ball.setAttribute('opacity',0)},700);return}
      requestAnimationFrame(step);return;
    }
    const e=t<.5?2*t*t:1-(-2*t+2)**2/2;
    const x=L.a.x+(L.b.x-L.a.x)*e,y=L.a.y+(L.b.y-L.a.y)*e,h=4*L.H*e*(1-e);
    rot=Math.sin(now/180)*6*Math.sin(Math.PI*t);
    const sq=Math.max(0,1-(now-squash)/350),pop=1+.22*Math.sin(Math.PI*Math.min(1,(now-squash)/350))*(sq>0?1:0);
    setBall(x,y,h,pop,pop,rot);
    if(L.land){const yy=y-h;if(!last||Math.hypot(x-last.x,yy-last.y)>7){el('circle',{cx:x,cy:yy,r:1.1,class:'trail'},tg);last={x,y:yy}}}
    requestAnimationFrame(step);
  }
}

/* controls */
$('replay').addEventListener('click',play);
$('sound').addEventListener('click',()=>{
  soundOn=!soundOn;
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){soundOn=false}
  $('sw').style.display=soundOn?'none':'';
  $('sound').setAttribute('aria-label',soundOn?'Sound off':'Sound on');
  if(soundOn)play();
});
const bn=$('banner');
function fsIcon(on){$('fsi').setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'Exit full screen':'Full screen')}
$('fs').addEventListener('click',async()=>{
  const on=document.fullscreenElement||bn.classList.contains('pseudo-fs');
  if(on){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}bn.classList.remove('pseudo-fs');fsIcon(false);return}
  try{await bn.requestFullscreen();fsIcon(true)}catch(e){if(document.documentElement.classList.contains('embed')){const w=window.open(location.href,'_blank');if(w)return}bn.classList.add('pseudo-fs');fsIcon(true)}
});
document.addEventListener('fullscreenchange',()=>fsIcon(!!document.fullscreenElement||bn.classList.contains('pseudo-fs')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&bn.classList.contains('pseudo-fs')){bn.classList.remove('pseudo-fs');fsIcon(false)}});

(document.fonts?document.fonts.ready:Promise.resolve()).then(play);
}
</script>
